version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/website"
      - "/extensions/*"
      - "/skills/*/scripts"
      - "/cookbook/copilot-sdk/nodejs/recipe"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
